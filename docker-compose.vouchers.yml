# docker compose -f docker-compose.yml -f docker-compose.vouchers.yml up -d --build
services:
  frontend:
    environment:
      VOUCHER_SALES_ENABLED: ${VOUCHER_SALES_ENABLED:-false}
      POS_INTERNAL_URL: ${POS_INTERNAL_URL:-http://pos:8000}
      ONLINE_SERVICE_TOKEN: ${ONLINE_SERVICE_TOKEN:-}
      VOUCHER_TRUSTED_PROXY_CIDRS: ${VOUCHER_TRUSTED_PROXY_CIDRS:-}
      VOUCHER_RATE_DIR: /app/config/voucher-rate-limits
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ""
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_MFA_SECRET: ${ADMIN_MFA_SECRET:-}
    networks:
      - default
      - vouchers
networks:
  vouchers:
    external: true
    name: aixtraball-vouchers
